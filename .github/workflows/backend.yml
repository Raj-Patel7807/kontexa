name: Backend CI

on:
  workflow_call:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync

      - name: Run Ruff Linter
        run: |
          cd backend
          uv run ruff check .

      - name: Run Ruff Formatter Check
        run: |
          cd backend
          uv run ruff format --check .

      - name: Run Pytest Test Suite
        run: |
          cd backend
          uv run pytest
