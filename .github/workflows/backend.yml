name: Backend CI

on:
  workflow_call:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run Ruff linter
        working-directory: backend
        run: uv run ruff check .

      - name: Run Ruff formatter check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Run Pytest
        working-directory: backend
        run: uv run pytest
