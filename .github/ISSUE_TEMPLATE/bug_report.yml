name: Bug Report
description: Report a reproducible problem in Kontexa
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Kontexa. Please search for an existing issue before filing a new one.

  - type: dropdown
    id: component
    attributes:
      label: Affected area
      options:
        - Backend
        - Frontend
        - Database
        - Infrastructure / Docker
        - CI/CD
        - Documentation
        - Integration
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Describe the problem and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of steps that reliably shows the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment and version
      description: Include OS, browser/runtime, and branch, release, or commit when known.

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Remove passwords, API keys, tokens, credentials, private connection strings, and other secrets before posting.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, links, or other details that could help investigate.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for existing issues and did not find a duplicate.
          required: true
